<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Звёздная ночь</title>
  <meta name="theme-color" content="#0b1430">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%231b2f63'/><path d='M38 14a18 18 0 1 0 12 30A15 15 0 1 1 38 14z' fill='%23f5d547'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/starry-night.jpg" as="image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="sparks" aria-hidden="true"></canvas>

  <main class="wrap">
    <header class="clock">
      <div id="time" class="time">--:--</div>
      <div class="sub"><span id="hello"></span> · <span id="date"></span></div>
    </header>

    <section class="glass panel dock">
      <div id="search" class="search">
        <button class="engine" data-engine="google" aria-label="Поиск в Google" title="Google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
        </button>
        <button class="engine" data-engine="yandex" aria-label="Поиск в Яндексе" title="Яндекс">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="20" fill="#FC3F1D"/>
            <text x="24" y="33" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26">Я</text>
          </svg>
        </button>

        <form class="search-box" autocomplete="off">
          <span class="search-chip" hidden>
            <img alt="Прикреплённая картинка">
            <button type="button" aria-label="Убрать картинку">×</button>
          </span>
          <input class="search-input" type="text" name="q" spellcheck="false" aria-label="Запрос">
          <button type="button" class="search-attach" aria-label="Прикрепить изображение" title="Прикрепить изображение (или вставь ⌘V / перетащи)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="submit" class="search-go" aria-label="Искать">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input class="search-file" type="file" accept="image/*" hidden>
        </form>
      </div>

      <nav id="favorites" class="favorites" aria-label="Избранное"></nav>
    </section>

    <div id="groups" class="groups"></div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
